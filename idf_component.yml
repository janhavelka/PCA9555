version: "3.0.1"
description: "Production-oriented, framework-neutral PCA9555 16-bit I/O expander driver."
license: "MIT"
url: "https://www.thymos.cz"
repository: "https://github.com/janhavelka/PCA9555.git"
documentation: "https://github.com/janhavelka/PCA9555#readme"
issues: "https://github.com/janhavelka/PCA9555/issues"
maintainers:
  - "Jan Havelka <info@thymos.cz>"
tags:
  - pca9555
  - io-expander
  - gpio
  - i2c
targets:
  - esp32s2
  - esp32s3
dependencies:
  idf: ">=5.4,<6.0"
files:
  exclude:
    - "examples/**/*"
    - "test/**/*"
    - "docs/**/*"
    - "tools/**/*"
    - "build_output.txt"
    - "build_result.txt"
    - "platformio.ini"
