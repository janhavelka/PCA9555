[platformio]
src_dir = .
default_envs = esp32s3dev

[env]
; Reproducibility baseline validated during Prompt 06:
; PlatformIO Core 6.1.19, pioarduino Espressif 32 platform 54.03.20,
; Arduino core 3.2.0, ESP-IDF libs 5.4.0.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
extra_scripts = pre:scripts/generate_version.py

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = send_on_enter, esp32_exception_decoder, colorize
monitor_eol = LF
monitor_echo = yes

upload_speed = 921600

build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Werror=return-type
  -Iinclude
  -Iexamples
  -DCORE_DEBUG_LEVEL=0
  -DLOG_LEVEL=2

debug_tool = esp-prog
debug_init_break = tbreak setup

; -------------------------
; ESP32-S3 Arduino dev config
; Compile-only target for esp32-s3-devkitc-1 with 4 MB flash-compatible
; settings and no PSRAM dependency in the PCA9555 core or example.
; -------------------------
[env:esp32s3dev]
extends = env
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
  -<*>
  +<examples/01_basic_bringup_cli/**>
  +<examples/common/**>
  +<src/**>
  +<include/**>

; -------------------------
; ESP32-S2 Arduino dev config
; Compile-only target for esp32-s2-saola-1 with 4 MB flash-compatible settings.
; -------------------------
[env:esp32s2dev]
extends = env
board = esp32-s2-saola-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_upload.after_reset = no_reset_stub
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
  -<*>
  +<examples/01_basic_bringup_cli/**>
  +<examples/common/**>
  +<src/**>
  +<include/**>

; -------------------------
; Native host tests
; -------------------------
[env:native]
platform = native
framework =
test_framework = unity
test_build_src = true
build_src_filter =
  -<*>
  +<src/**>
  +<include/**>
build_flags =
  -std=c++17
  -Iinclude
  -Iexamples
  -Itest/stubs
extra_scripts = pre:scripts/generate_version.py
